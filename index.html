<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quotidien</title>
  <meta name="description" content="Tracker d'habitudes et planificateur de journée">
  <meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1322" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Quotidien">
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div>
        <h1 id="view-title">Aujourd'hui</h1>
        <p id="today" class="muted"></p>
      </div>
    </div>
    <div class="sky"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Navigation principale">
    <span class="tab-pill" aria-hidden="true"></span>
    <a href="#aujourdhui" data-tab="aujourdhui"><span data-icon="habits"></span><span>Aujourd'hui</span></a>
    <a href="#planning" data-tab="planning"><span data-icon="planning"></span><span>Planning</span></a>
    <a href="#stats" data-tab="stats"><span data-icon="stats"></span><span>Stats</span></a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
