<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prototype Stats</title>
  <meta name="theme-color" content="#1f6f5c">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .proto-switch { position: sticky; top: 0; z-index: 6; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--border); }
    .proto-switch p { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-align: center; }
    .proto-switch .segmented button { min-height: 44px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); font: inherit; font-weight: 650; font-size: 15px; }
    .proto-switch .segmented button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .screen-title { font-size: 26px; margin: 4px 0 2px; }
    .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; }
    .tabbar button.active { color: var(--accent); }
    .stat-link { border: none; background: var(--accent-soft); color: var(--accent); font: inherit; font-weight: 700; font-size: 14px; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
    .mock-card { display: flex; align-items: center; gap: 12px; }
    .mock-card .grow { flex: 1; }
  </style>
</head>
<body>
  <div class="proto-switch">
    <p>Prototype · données fictives · ta vraie app n'est pas modifiée</p>
    <div class="segmented">
      <button data-opt="A">A · Onglet Stats</button>
      <button data-opt="B">B · Depuis l'habitude</button>
    </div>
  </div>
  <main id="view" class="view"></main>
  <nav class="tabbar" id="tabbar"></nav>

  <script type="module">
    import { dateKey, addDays, fmt, esc } from './js/util.js';
    import { goalLabel, status, isScheduled } from './js/habits-model.js';
    import { currentStreak, dayResult } from './js/stats.js';
    import { overviewTiles, globalCalendar, habitTiles, habitCalendar, habitChart, bindCharts } from './js/stats-ui.js';

    // ---- Données fictives : 60 jours d'historique ----
    const today = dateKey();
    const created = addDays(today, -60);
    const all = [0, 1, 2, 3, 4, 5, 6];
    const habits = [
      { id: 'cal', name: 'Calories', type: 'range', unit: 'kcal', min: 1600, max: 1900, step: 100, days: all, created },
      { id: 'pas', name: 'Marche', type: 'min', unit: 'pas', min: 7000, step: 500, days: all, created },
      { id: 'trv', name: 'Travail', type: 'min', unit: 'h', min: 6, step: 0.5, days: [1, 2, 3, 4, 5, 6], created },
      { id: 'gym', name: 'Salle de sport', type: 'check', days: [1, 3, 5], created },
    ];
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const entries = {};
    for (let i = 60; i >= 0; i--) {
      const k = addDays(today, -i);
      const good = i < 12 ? 0.85 : 0.65; // de mieux en mieux sur les derniers jours
      entries[k] = {
        cal: Math.round((rnd() < good ? 1620 + rnd() * 270 : rnd() < 0.5 ? 1950 + rnd() * 400 : 1300 + rnd() * 250) / 10) * 10,
        pas: Math.round((rnd() < good ? 7000 + rnd() * 4000 : 3000 + rnd() * 3900) / 100) * 100,
        trv: Math.round((rnd() < good ? 6 + rnd() * 3 : 2 + rnd() * 3.5) * 2) / 2,
        gym: rnd() < good ? 1 : 0,
      };
    }
    entries[today] = { cal: 1150, pas: 4200, trv: 3, gym: 0 }; // journée en cours

    // ---- Navigation du prototype ----
    let opt = 'A', screen = 'home', current = null;
    const view = document.getElementById('view');
    bindCharts(view);

    function go(s, id) { screen = s; current = id; draw(); scrollTo(0, 0); }

    function draw() {
      document.querySelectorAll('[data-opt]').forEach(b => b.classList.toggle('on', b.dataset.opt === opt));
      drawTabbar();
      if (screen === 'detail') return detail(habits.find(h => h.id === current));
      if (screen === 'overview') return overviewB();
      opt === 'A' ? statsTab() : habitsTabB();
    }

    function drawTabbar() {
      const icon = {
        Habitudes: '<path d="M5 12l4 4L19 6"/>',
        Stats: '<path d="M5 20V11M12 20V5M19 20v-6"/>',
        Planning: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
      };
      const tabs = opt === 'A' ? ['Habitudes', 'Stats', 'Planning'] : ['Habitudes', 'Planning'];
      const active = opt === 'A' ? 'Stats' : 'Habitudes';
      document.getElementById('tabbar').innerHTML = tabs.map(t => `
        <button class="${t === active ? 'active' : ''}" data-tab="${t}">
          <svg viewBox="0 0 24 24" aria-hidden="true">${icon[t]}</svg><span>${t}</span>
        </button>`).join('');
    }

    function last14(h) {
      let s = '';
      for (let i = 13; i >= 0; i--) {
        const r = dayResult(h, entries, addDays(today, -i));
        s += `<i class="${r === 'pending' ? '' : r || ''}"></i>`;
      }
      return `<div class="dots" aria-hidden="true">${s}</div>`;
    }

    // Option A : un onglet Stats avec le bilan puis la liste des habitudes.
    function statsTab() {
      view.innerHTML = `
        <h1 class="screen-title">Stats</h1>
        <div class="section-title">Bilan</div>
        ${overviewTiles(habits, entries)}
        ${globalCalendar(habits, entries)}
        <div class="section-title">Par habitude</div>
        ${habits.map(h => `
          <button class="card habit-row" data-open="${h.id}">
            <span class="grow"><span class="name">${esc(h.name)}</span>
              <span class="muted small">${goalLabel(h) || 'Oui / Non'}</span>${last14(h)}</span>
            <span class="streak">🔥 ${currentStreak(h, entries)} j<small>série</small></span>
            <span aria-hidden="true">›</span>
          </button>`).join('')}`;
    }

    // Option B : l'écran Habitudes habituel, avec la série et un bouton Stats sur chaque carte.
    function habitsTabB() {
      const vals = entries[today];
      view.innerHTML = `
        <h1 class="screen-title">Habitudes</h1>
        <p class="muted" style="margin:0 0 14px">Aperçu simplifié de l'écran du jour</p>
        ${habits.filter(h => isScheduled(h, today)).map(h => {
          const st = status(h, vals[h.id]);
          return `
          <div class="card habit ${h.type === 'check' ? '' : st}">
            <div class="mock-card">
              <span class="grow"><span class="name">${esc(h.name)}</span><br>
                <span class="muted small">${h.type === 'check' ? (vals[h.id] ? 'Fait' : 'Pas encore') : `${fmt(vals[h.id])} ${esc(h.unit)} · ${goalLabel(h)}`}</span></span>
              <span class="badge">🔥 ${currentStreak(h, entries)} j</span>
              <button class="stat-link" data-open="${h.id}">Stats ›</button>
            </div>
          </div>`;
        }).join('')}
        <button class="btn secondary" data-overview>Voir le bilan global</button>`;
    }

    function overviewB() {
      view.innerHTML = `
        <button class="back" data-back style="border:none;background:none;font:inherit">‹ Retour</button>
        <h1 class="screen-title">Bilan global</h1>
        <div class="section-title">Résumé</div>
        ${overviewTiles(habits, entries)}
        ${globalCalendar(habits, entries)}`;
    }

    function detail(h) {
      view.innerHTML = `
        <button class="back" data-back style="border:none;background:none;font:inherit">‹ Retour</button>
        <h1 class="screen-title">${esc(h.name)}</h1>
        <p class="muted" style="margin:0 0 14px">${goalLabel(h) || 'Oui / Non'}</p>
        ${habitTiles(h, entries)}
        ${h.type === 'check' ? '' : `<div class="section-title">30 derniers jours</div>${habitChart(h, entries)}`}
        <div class="section-title">Calendrier</div>
        ${habitCalendar(h, entries)}`;
    }

    document.addEventListener('click', e => {
      const t = e.target.closest('[data-opt],[data-open],[data-back],[data-overview],[data-tab]');
      if (!t) return;
      if (t.dataset.opt) { opt = t.dataset.opt; go('home'); }
      else if (t.dataset.open) go('detail', t.dataset.open);
      else if ('back' in t.dataset) go('home');
      else if ('overview' in t.dataset) go('overview');
      else if (t.dataset.tab) go('home'); // les onglets ne mènent qu'à l'écran de l'option choisie
    });

    // Lien direct possible : prototype.html?opt=B&s=detail&id=cal
    const q = new URLSearchParams(location.search);
    if (q.get('opt')) opt = q.get('opt');
    if (q.get('s')) { screen = q.get('s'); current = q.get('id'); }
    draw();
  </script>
</body>
</html>
